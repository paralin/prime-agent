# Kernel-side package for event-driven session wake-ups. The bundled RLM
# runtime supplies the host bridge, so it is intentionally not a dependency.
[project]
name = "external-event"
version = "0.1.0"
description = "Prime Agent external-event emission and retained Bash job completion"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/external_event"]

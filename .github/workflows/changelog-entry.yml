name: Changelog entry

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

permissions:
  pull-requests: read

jobs:
  changelog-entry:
    name: Check changelog entry
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Require a changelog entry for changed packages or an explicit opt-out
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.labels.some((label) => label.name === "no-changelog")) {
              core.info("Label no-changelog is set; skipping changelog check.");
              return;
            }
            if (pr.changed_files > 3000) {
              core.setFailed("PR changes more than 3000 files; split it or apply the no-changelog label.");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const packages = ["agent", "ai", "coding-agent", "tui"];
            const failing = [];
            for (const pkg of packages) {
              const srcPrefix = `packages/${pkg}/src/`;
              const srcChanged = files.some(
                (file) =>
                  file.filename.startsWith(srcPrefix) ||
                  (file.previous_filename !== undefined && file.previous_filename.startsWith(srcPrefix)),
              );
              const changelogChanged = files.some(
                (file) => file.filename === `packages/${pkg}/CHANGELOG.md` && file.additions > 0,
              );
              if (srcChanged && !changelogChanged) {
                failing.push(pkg);
              }
            }
            if (failing.length === 0) {
              core.info("Changelog entries present for all changed packages.");
              return;
            }
            core.setFailed(
              failing
                .map(
                  (pkg) =>
                    `packages/${pkg}/src changed but its CHANGELOG.md has no added entry. ` +
                    "Add a bullet under ## [Unreleased], or apply the no-changelog label.",
                )
                .join("\n"),
            );
